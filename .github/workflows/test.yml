name: Test

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - feature/*
    tags:
      - v*
    paths:
      - 'OpenCL/**.h'
      - 'OpenCL/**.cl'
      - 'include/**.h'
      - 'src/**.c'
      - 'tools/**'
      - '**/Makefile'
      - '.github/workflows/test.yml'

jobs:
  test-linux:
    strategy:
      fail-fast: false
      matrix:
        shared: [0, 1]
    name: Test Linux (${{ matrix.shared == 0 && 'Static' || 'Shared' }})
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Install PoCL
        run: sudo apt-get update && sudo apt-get install --no-install-recommends --yes pocl-opencl-icd
      - name: Install
        env:
          SHARED: ${{ matrix.shared }}
        run: sudo make install
      - name: Test
        run: hashcat -m 0 -a 7 --force example0.hash ?a?a?a?a example.dict

